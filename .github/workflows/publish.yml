name: Publish to npm

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------
      # TYPECHECK ONLY LIB + ESLINT PLUGIN (exclude test app)
      # -----------------------------------------------------
      - name: Typecheck library packages
        run: |
          pnpm --filter ./packages/next-link-no-autoprefetch typecheck
          pnpm --filter ./packages/eslint-plugin-next-link-no-autoprefetch typecheck

      # -----------------------------------------------------
      # LINT ONLY LIB + ESLINT PLUGIN (exclude test app)
      # -----------------------------------------------------
      - name: Lint library packages
        run: |
          pnpm --filter ./packages/next-link-no-autoprefetch lint || true
          pnpm --filter ./packages/eslint-plugin-next-link-no-autoprefetch lint || true

      # -----------------------------------------------------
      # BUILD ONLY LIB + ESLINT PLUGIN (exclude test app)
      # -----------------------------------------------------
      - name: Build library packages
        run: |
          pnpm --filter ./packages/next-link-no-autoprefetch build
          pnpm --filter ./packages/eslint-plugin-next-link-no-autoprefetch build

      # -----------------------------------------------------
      # VERSION CHECK (unchanged)
      # -----------------------------------------------------
      - name: Check if version already exists on npm
        working-directory: packages/next-link-no-autoprefetch
        run: |
          VERSION=${{ github.event.release.tag_name }}
          PKG="@vividwebau/next-link-no-autoprefetch"
          EXISTS=$(npm view $PKG@$VERSION version || echo "none")
          if [ "$EXISTS" != "none" ]; then
            echo "Version $VERSION already exists on npm. Skipping publish."
            exit 0
          fi

      # -----------------------------------------------------
      # PUBLISH (unchanged)
      # -----------------------------------------------------
      - name: Publish to npm
        working-directory: packages/next-link-no-autoprefetch
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
